name = "lake-level-almanac"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true
tsconfig = "tsconfig.json"

# Secrets SIGNING_KEY, STRIPE_WEBHOOK_SECRET and STRIPE_SECRET_KEY live in the dashboard and
# are preserved across deploys (wrangler keeps secret_text bindings not listed here).
# STRIPE_WEBHOOK_SECRET belongs to the Stripe webhook endpoint .../stripe-webhook.

# Paid-session store shared with ml0x-delivery (rows carry a service column). Schema: paid-store.sql
[[d1_databases]]
binding = "PAID"
database_name = "checkout-paid"
database_id = "a30fd33a-c9b2-4a00-89d5-42b054fe2452"

# One Stripe endpoint serves both Workers (the account is at 16 live endpoints). Signed events
# that this Worker accepts are passed on to ml0x-delivery, which uses the same STRIPE_WEBHOOK_SECRET.
[[services]]
binding = "ML0X_HOOK"
service = "ml0x-delivery"

[[kv_namespaces]]
binding = "ALMANAC_ASSETS"
id = "b846f43c1ccd410e863eed51cf7ab7d8"

[[kv_namespaces]]
binding = "ALMANAC_ORDERS"
id = "bd1eb77d66e24161bd8997381ba856de"

[vars]
ALLOWED_ORIGINS = "https://lakelevelnow.com,http://localhost:4321,http://localhost:4322"
ALMANAC_MODE = "live"
# Comma-separated: new $79 link first, old $49 link stays until the site deploys.
LINK_BUNDLE_ID = "plink_1U9ZakJKCamubEm1QrZZtgog,plink_1U1veYJKCamubEm1TwmO7yDa"
LINK_SINGLE_ID = "plink_1U1veWJKCamubEm1PGbmVIAx"

# ---- TEST twin: Stripe TEST mode + dummy fixture zips (never the real product).
[env.test]
name = "lake-level-almanac-test"
workers_dev = true

[[env.test.kv_namespaces]]
binding = "ALMANAC_ASSETS"
id = "befded96e5634a86897a6d2e02b086ac"

[[env.test.kv_namespaces]]
binding = "ALMANAC_ORDERS"
id = "c4a151a2dd1a46eea2c84552d5ec2165"

[env.test.vars]
ALLOWED_ORIGINS = "https://lakelevelnow.com,http://localhost:4321,http://localhost:4322"
ALMANAC_MODE = "test"
LINK_SINGLE_ID = "plink_1U9ZnuJKCamubEm1214M88PV"
LINK_BUNDLE_ID = "plink_1U9ZnwJKCamubEm1VQO8LYi3"
