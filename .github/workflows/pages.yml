name: Pages

# Build + publish to GitHub Pages (serves lakelevelnow.com), then submit to
# IndexNow once HTTPS is live. Apex A-records point at GitHub Pages IPs.
on:
  push:
    branches: [main]
  schedule:
    # Daily, not weekly. Titles and meta descriptions now carry the live reading, and the
    # depth page's H1 says "right now", so a Monday-only build meant the SERP could show a
    # figure up to seven days old — exactly the freshness limit rules.md forbids labelling
    # as live. Validated 2026-07-27: the page read "Jul 20" while the gage read 3,522.6 ft.
    - cron: '23 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # A broken paid listing in directory.json fails a push here. The daily cron still builds and skips it.
      - name: Check paid listings
        if: github.event_name == 'push'
        run: node -e "const d=JSON.parse(require('fs').readFileSync('src/data/directory.json','utf8'));import('./src/lib/directory.mjs').then(m=>{for(const s of m.DIRECTORY_LAKES)m.listingsFor(d,s)})"
      - name: Fetch live data (USGS + CDEC)
        run: npm run fetch
      - name: Build
        run: npm run build
        env:
          # Stripe payment links for Lake Level Almanac. These are public URLs, not
          # secrets — anyone who visits /almanac/ sees them — so they live here rather
          # than in repository secrets, where a missing value would be invisible.
          # If either is empty the buy controls render visibly disabled instead of
          # linking nowhere, so a bad deploy looks broken rather than swallowing clicks.
          PUBLIC_ALMANAC_LINK_SINGLE: https://buy.stripe.com/00w3cw2oafoc7VXgjj43S0q
          PUBLIC_ALMANAC_LINK_BUNDLE: https://buy.stripe.com/4gM5kE1k63Fugst0kl43S0B
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sole IndexNow ping for the apex — lives here because pages.yml is what
      # publishes lakelevelnow.com. The script is best-effort (bounded retry +
      # timeout, always exits 0); continue-on-error is a second safety net.
      - name: Submit to IndexNow (non-blocking — Bing re-verifies on its own schedule)
        continue-on-error: true
        run: |
          sleep 20   # let GitHub Pages finish serving the new deploy
          node scripts/indexnow-submit.mjs
